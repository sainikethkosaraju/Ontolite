name: demo-data
# Downloads the latest SEC Financial Statement Data Sets quarter (public domain) and builds the demo store.
# Manual. Needs the repository secret SEC_USER_AGENT ("Your Name you@example.com": the SEC requires contact details).
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Download the latest available quarter (newest first)
        run: |
          test -n "$SEC_USER_AGENT" || { echo "::error::set the SEC_USER_AGENT secret"; exit 1; }
          mkdir -p sec-data && cd sec-data
          for y in 2026 2025; do for q in 4 3 2 1; do
            u="https://www.sec.gov/files/dera/data/financial-statement-data-sets/${y}q${q}.zip"
            if curl -fsSL --retry 3 --max-time 300 -A "$SEC_USER_AGENT" -o fsds.zip "$u"; then
              echo "got ${y}q${q} ($(du -h fsds.zip | cut -f1))"; unzip -oq fsds.zip sub.txt num.txt tag.txt; break 2
            fi
          done; done
          test -f sub.txt || { echo "::error::no quarter could be downloaded"; exit 1; }
          wc -l sub.txt num.txt tag.txt
      - name: Build the store (batched ingest, progress on stderr)
        timeout-minutes: 20
        run: |
          ontolite init --dir .ontolite
          rm -f .ontolite/data/*   # drop the synthetic sample files; real data only
          cp sec-data/sub.txt sec-data/num.txt sec-data/tag.txt .ontolite/data/
          ontolite ingest --dir .ontolite
          ontolite demo-grants --dir .ontolite --companies 5
      - name: Sanity check (counts, governed queries, audit chain)
        run: python scripts/demo_check.py .ontolite
