tables:
  - {file: sub.txt, object_type: Company, columns: {cik: cik, name: name, sic: sic}}
  - file: sub.txt
    object_type: Filing
    columns: {adsh: adsh, form: form, period: period, filed: filed, fy: fy}
    links: [{link: filings, from_col: cik, to_col: adsh}]
  - {file: tag.txt, object_type: Concept, columns: {tag: tag, tlabel: tlabel, datatype: datatype}}
  - file: num.txt
    object_type: Fact
    key_template: "{adsh}|{tag}|{ddate}|{qtrs}"
    columns: {adsh: adsh, tag: tag, ddate: ddate, value: value, uom: uom}
    links:
      - {link: facts, from_col: adsh, to_template: "{adsh}|{tag}|{ddate}|{qtrs}"}
      - {link: concept, to_col: tag}
  - {file: internal_companies.tsv, object_type: Company, columns: {cik: cik, risk_rating: risk_rating}}
  - {file: internal_filings.tsv, object_type: Filing, columns: {adsh: adsh, internal_notes: internal_notes}}
